# Project-wide lint policy. scripts/check.sh and CI apply this configuration
# independently to every Go module in the workspace.
version: "2"
linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      # Explicit blank assignments document intentionally ignored errors.
      check-type-assertions: false
      check-blank: false
    govet:
      disable:
        # These checks trade readability for low-value layout or shadow noise.
        - fieldalignment
        - shadow
      enable-all: true
    misspell:
      # Keep user-facing strings and documentation on one spelling convention.
      locale: US
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
        path: _test\.go
      # These explicit function types are compile-time constructor contracts;
      # inferring them would erase the assertion the test exists to make.
      - linters:
          - staticcheck
        path: models/([^/]+/)?internal/arch/.*_test\.go
        text: QF1011
    paths:
      - node_modules
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/Tangerg/lynx
  exclusions:
    generated: lax
    paths:
      - node_modules
