<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>lyra</title>
    <!-- First-paint theme class sync.
         Reads the persisted theme id from the same localStorage key the
         Zustand store uses (`lyra.ui`) and toggles `theme-{scheme}` on
         <html> BEFORE any CSS parses, preventing a flash of the wrong scheme.
         "system" (the default) + a missing value follow prefers-color-scheme;
         "light"/"dark" are explicit; custom theme ids default to dark until
         the JS-side `applyTheme()` corrects the class. -->
    <script>
      (function () {
        // No matchMedia reads as light — the same answer the theme context's
        // system-appearance adapter and a display without dark mode give.
        var systemDark =
          !!window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
        var scheme = systemDark ? "dark" : "light";
        try {
          var raw = localStorage.getItem("lyra.ui");
          var state = raw ? JSON.parse(raw)?.state : null;
          var id = state?.theme;
          if (id === "light") scheme = "light";
          else if (id && id !== "system") scheme = "dark"; // "dark" + custom ids
          // "system" / missing → keep the prefers-color-scheme default above.
        } catch (_) {
          /* localStorage blocked, malformed JSON — keep the system default */
        }
        var root = document.documentElement;
        root.dataset.visualStyle = state?.visualStyle || "lyra";
        root.classList.add("theme-" + scheme);
        // Paint the canvas colour on <html> BEFORE the CSS bundle parses, so a
        // cold boot opens straight into the app surface instead of flashing white.
        // These two literals ARE `--color-bg` per scheme (globals.css); they can't
        // be read from the token, because the whole point is to paint before the
        // stylesheet exists. The dark one had drifted to #121212 against a #101010
        // token, so a dark cold boot painted one grey and repainted another a
        // moment later. `check-bootstrap` fails on any such drift now.
        root.style.backgroundColor = scheme === "light" ? "#ffffff" : "#1d1f23";
      })();
    </script>
    <!-- Focus-ring modality.
         The Wails WebView reports :focus-visible on a plain mouse click too, not
         just keyboard nav — so the accent focus ring flashed on every click.
         Track the last input device on `<html data-pointer>` (pointer by
         default) and flip to keyboard only on a nav key (Tab / arrows); the
         accent ring in globals.css is gated on `html:not([data-pointer])`, so it
         shows only for genuine keyboard focus. Typing a character never
         resurrects it — only nav keys count. -->
    <script>
      (function () {
        var root = document.documentElement;
        root.setAttribute("data-pointer", "");
        addEventListener(
          "pointerdown",
          function () {
            root.setAttribute("data-pointer", "");
          },
          true,
        );
        addEventListener(
          "keydown",
          function (e) {
            if (e.key === "Tab" || e.key.indexOf("Arrow") === 0)
              root.removeAttribute("data-pointer");
          },
          true,
        );
      })();
    </script>
    <!-- Fonts are bundled variable subsets served from /fonts — see
         globals.css. Preloaded because both faces are on the very first frame:
         without this the window paints once in the CJK fallback and reflows. -->
    <link rel="preload" href="/fonts/geist.woff2" as="font" type="font/woff2" crossorigin />
    <link
      rel="preload"
      href="/fonts/jetbrains-mono.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <div id="root"></div>
    <script src="./src/main.tsx" type="module"></script>
  </body>
</html>
