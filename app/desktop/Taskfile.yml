# Build orchestration runs through `wails3 task <name>`, so no separate task binary is
# part of the desktop toolchain.
#
# Darwin is the only shipping target. The Go host still compiles elsewhere through
# window_chrome_other.go, but non-macOS packaging remains absent until it has an owner and
# a release target.
version: '3'

vars:
  APP_NAME: "scopeapp"
  BIN_DIR: "build/bin"
  PACKAGE_MANAGER: '{{.PACKAGE_MANAGER | default "npm"}}'
  # Single source for Vite's listener, Wails' webview URL, and the HMR client. See
  # frontend/vite.config.ts for why HMR cannot infer this value reliably.
  VITE_PORT: '{{.WAILS_VITE_PORT | default 5174}}'
  GOOS: '{{.GOOS | default OS}}'

includes:
  common: ./build/Taskfile.yml
  darwin: ./build/darwin/Taskfile.yml

tasks:
  build:
    summary: Builds the application
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
