<!doctype html><html class="light"><head><meta charset="utf-8"><title>Color</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--background)}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cap{font-size:11px;color:var(--muted);width:64px;flex-shrink:0}</style>
</head><body><div id="root"></div><script type="text/babel">
const {ColorSwatch, ColorSwatchPicker, ColorArea, ColorSlider, ColorField, ColorPicker, Label} = window.DesignSystem_df98fe;
function Demo(){
  const [c,setC]=React.useState('#2E6FF2');
  return <div style={{display:'grid',gridTemplateColumns:'auto auto 1fr',gap:24,alignItems:'start'}}>
    <ColorPicker value={c} hue={253}/>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <div className="field"><Label>Swatches</Label>
        <div className="row"><ColorSwatch color="var(--accent)"/><ColorSwatch color="var(--success)"/><ColorSwatch color="var(--warning)"/><ColorSwatch color="var(--danger)"/><ColorSwatch color="#00000033" shape="circle"/></div>
      </div>
      <div className="field"><Label>Picker</Label>
        <ColorSwatchPicker colors={['#2E6FF2','#12A150','#F5A524','#F31260','#7828C8']} value={c} onChange={setC} size={28}/>
      </div>
      <div className="field"><Label>Field</Label><div><ColorField value={c} onChange={setC}/></div></div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:14}}>
      <ColorSlider channel="hue" value={0.62}/>
      <ColorSlider channel="alpha" value={0.8} color={c}/>
      <ColorArea hue={253}/>
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
