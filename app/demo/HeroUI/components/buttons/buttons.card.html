<!doctype html><html class="light"><head><meta charset="utf-8"><title>Buttons</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--background)}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cap{font-size:11px;color:var(--muted);width:64px;flex-shrink:0}</style>
</head><body><div id="root"></div><script type="text/babel">
const {Button, ButtonGroup, CloseButton, ToggleButton, ToggleButtonGroup, Icon} = window.DesignSystem_df98fe;
function Demo(){
  const [sel,setSel]=React.useState('grid');
  return <>
    <div className="row">
      <Button variant="primary">Primary</Button>
      <Button variant="secondary">Secondary</Button>
      <Button variant="tertiary">Tertiary</Button>
      <Button variant="ghost">Ghost</Button>
      <Button variant="outline">Outline</Button>
      <Button variant="danger">Danger</Button>
      <Button variant="danger-soft">Danger soft</Button>
    </div>
    <div className="row">
      <span className="cap">Sizes</span>
      <Button size="sm">Small</Button><Button>Medium</Button><Button size="lg">Large</Button>
      <Button variant="secondary" startIcon={<Icon name="plus"/>}>With icon</Button>
      <Button variant="ghost" endIcon={<Icon name="arrow-right"/>}>Continue</Button>
    </div>
    <div className="row">
      <span className="cap">States</span>
      <Button isPending>Saving</Button>
      <Button isDisabled>Disabled</Button>
      <Button isPressed variant="secondary">Pressed</Button>
      <Button isIconOnly aria-label="Settings" variant="tertiary"><Icon name="settings"/></Button>
      <Button isIconOnly aria-label="Delete" variant="ghost"><Icon name="trash"/></Button>
      <CloseButton/>
    </div>
    <div className="row">
      <span className="cap">Groups</span>
      <ButtonGroup>
        <Button variant="tertiary" size="sm">Day</Button>
        <Button variant="tertiary" size="sm">Week</Button>
        <Button variant="tertiary" size="sm">Month</Button>
      </ButtonGroup>
      <ToggleButtonGroup>
        <ToggleButton size="sm" isSelected={sel==='grid'} onClick={()=>setSel('grid')}>Grid</ToggleButton>
        <ToggleButton size="sm" isSelected={sel==='list'} onClick={()=>setSel('list')}>List</ToggleButton>
      </ToggleButtonGroup>
      <Button fullWidth variant="outline" style={{maxWidth:160}}>Full width</Button>
    </div>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
