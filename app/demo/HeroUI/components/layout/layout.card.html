<!-- @dsCard group="Components" viewport="700x300" name="Layout" subtitle="Card, Surface, Separator, Toolbar, ScrollShadow" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><title>Layout</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:20px;background:var(--background)}#root{display:flex;flex-direction:column;gap:14px}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.cap{font-size:11px;color:var(--muted);width:64px;flex-shrink:0}</style>
</head><body><div id="root"></div><script type="text/babel">
const {Card, Surface, Separator, Toolbar, ScrollShadow, Button, Icon, Chip} = window.DesignSystem_df98fe;
function Demo(){
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr 200px',gap:16,alignItems:'start'}}>
    <Card>
      <Card.Header>
        <Card.Title>Usage this month</Card.Title>
        <Card.Description>Resets on the 1st.</Card.Description>
      </Card.Header>
      <Card.Content>124,900 of 250,000 requests.</Card.Content>
      <Card.Footer><Button size="sm" variant="primary">Upgrade</Button><Button size="sm" variant="ghost">Details</Button></Card.Footer>
    </Card>
    <div style={{display:'flex',flexDirection:'column',gap:12}}>
      <Surface variant="secondary" style={{padding:16,fontSize:14}}>Surface — secondary</Surface>
      <Surface variant="tertiary" style={{padding:16,fontSize:14}}>Surface — tertiary</Surface>
      <Separator/>
      <Toolbar>
        <Button variant="ghost" size="sm" isIconOnly aria-label="Home"><Icon name="home"/></Button>
        <Button variant="ghost" size="sm" isIconOnly aria-label="Layers"><Icon name="layers"/></Button>
        <Toolbar.Separator/>
        <Button variant="ghost" size="sm" isIconOnly aria-label="Delete"><Icon name="trash"/></Button>
      </Toolbar>
    </div>
    <ScrollShadow style={{maxHeight:180}}>
      <div style={{display:'flex',flexDirection:'column',gap:8,fontSize:13}}>
        {['Alpha','Bravo','Charlie','Delta','Echo','Foxtrot','Golf','Hotel','India'].map(n=>
          <div key={n} style={{display:'flex',justifyContent:'space-between'}}>{n}<Chip size="sm">v3</Chip></div>)}
      </div>
    </ScrollShadow>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
