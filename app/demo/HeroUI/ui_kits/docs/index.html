<!doctype html><html class="light" data-theme="light"><head><meta charset="utf-8"><title>HeroUI docs — UI kit</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;background:var(--background);color:var(--foreground);font-family:var(--font-sans)}</style>
</head><body><div id="root"></div>
<script type="text/babel" src="DocsShell.jsx"></script>
<script type="text/babel" src="ComponentPage.jsx"></script>
<script type="text/babel" src="SearchPalette.jsx"></script>
<script type="text/babel">
const {Button, Icon, Chip, Avatar, Switch, TextField, Checkbox, Select, Alert} = window.DesignSystem_df98fe;

const GROUPS = [
  {label:'Buttons', items:['Button','ButtonGroup','CloseButton','ToggleButton','ToggleButtonGroup']},
  {label:'Forms', items:['Input','TextField','TextArea','InputGroup','InputOTP','NumberField','SearchField','Checkbox','CheckboxGroup','RadioGroup','Switch','Slider']},
  {label:'Selection', items:['Select','ComboBox','ListBox','Dropdown','TagGroup']},
  {label:'Feedback', items:['Alert','Toast','Meter','ProgressBar','ProgressCircle','Skeleton','Spinner']},
  {label:'Layout', items:['Card','Surface','Separator','Toolbar','ScrollShadow']},
  {label:'Navigation', items:['Accordion','Breadcrumbs','Disclosure','Link','Pagination','Tabs']},
  {label:'Overlays', items:['Modal','AlertDialog','Drawer','Popover','Tooltip']},
  {label:'Content', items:['Avatar','Badge','Chip','Kbd','Typography','Table']},
];
const ALL = GROUPS.flatMap(g => g.items);

const PAGES = {
  Button: {
    description: 'Buttons trigger an action or event. Pill-shaped by default, with seven variants driven entirely by CSS custom properties.',
    classes: ['.button','.button--sm','.button--md','.button--lg','.button--primary','.button--secondary','.button--tertiary','.button--ghost','.button--outline','.button--danger','.button--danger-soft','.button--icon-only','.button--full-width'],
    props: [['variant',"'primary' | 'secondary' | 'tertiary' | 'ghost' | 'outline' | 'danger'","'primary'"],['size',"'sm' | 'md' | 'lg'","'md'"],['isIconOnly','boolean','false'],['isPending','boolean','false'],['fullWidth','boolean','false']],
    preview: <>
      <Button variant="primary">Primary</Button>
      <Button variant="secondary">Secondary</Button>
      <Button variant="outline">Outline</Button>
      <Button variant="ghost" startIcon={<Icon name="plus"/>}>New</Button>
      <Button variant="danger">Delete</Button>
    </>,
  },
  Switch: {
    description: 'Switches toggle a setting on or off and apply immediately. Built on React Aria Components with a CSS-only thumb transition.',
    classes: ['.switch','.switch__track','.switch__thumb','.switch[data-selected="true"]'],
    props: [['isSelected','boolean','—'],['defaultSelected','boolean','false'],['isDisabled','boolean','false'],['onChange','(isSelected: boolean) => void','—']],
    preview: <><Switch defaultSelected>Email notifications</Switch><Switch>Weekly digest</Switch></>,
  },
  Alert: {
    description: 'Alerts communicate the state of a page or a process inline. Semantic colours resolve to their soft token pair so text stays legible on light accent themes.',
    classes: ['.alert','.alert__icon','.alert__content','.alert__title','.alert__description','.alert--accent','.alert--success','.alert--warning','.alert--danger'],
    props: [['color',"'accent' | 'success' | 'warning' | 'danger'",'—'],['title','ReactNode','—'],['icon','ReactNode','auto'],['onClose','() => void','—']],
    preview: <div style={{display:'flex',flexDirection:'column',gap:10,width:'100%',maxWidth:460}}>
      <Alert color="success" title="Deployed">Commit 8f2a1c is live.</Alert>
      <Alert color="warning" title="Usage at 92%">Add a payment method to avoid interruption.</Alert>
    </div>,
  },
  Card: {
    description: 'Cards group related content on a surface. Every internal piece — header, title, description, content, footer — is a real component you can move or remove.',
    classes: ['.card','.card__header','.card__title','.card__description','.card__content','.card__footer','.card--secondary','.card--tertiary'],
    props: [['variant',"'transparent' | 'default' | 'secondary' | 'tertiary'","'default'"]],
    preview: <div style={{width:300}}>{React.createElement(window.DesignSystem_df98fe.Card, null,
      React.createElement(window.DesignSystem_df98fe.Card.Header, null,
        React.createElement(window.DesignSystem_df98fe.Card.Title, null, 'Usage this month'),
        React.createElement(window.DesignSystem_df98fe.Card.Description, null, 'Resets on the 1st.')),
      React.createElement(window.DesignSystem_df98fe.Card.Content, null, '124,900 of 250,000 requests.'),
      React.createElement(window.DesignSystem_df98fe.Card.Footer, null, React.createElement(Button, {size:'sm', variant:'primary'}, 'Upgrade')))}</div>,
  },
};

function App(){
  const [theme,setTheme]=React.useState('light');
  const [current,setCurrent]=React.useState('Button');
  const [query,setQuery]=React.useState('');
  const [search,setSearch]=React.useState(false);
  const [section,setSection]=React.useState('Components');
  React.useEffect(()=>{
    const root=document.documentElement;
    root.className=theme; root.setAttribute('data-theme',theme);
  },[theme]);
  React.useEffect(()=>{
    const h=e=>{ if((e.metaKey||e.ctrlKey)&&e.key==='k'){e.preventDefault();setSearch(true);} if(e.key==='Escape')setSearch(false); };
    window.addEventListener('keydown',h); return ()=>window.removeEventListener('keydown',h);
  },[]);
  const page=PAGES[current]||{
    description:'This page is intentionally left as a stub — the source docs for '+current+' were not read in this build.',
    classes:['.'+current.toLowerCase()],
    props:[['—','—','—']],
    preview:<span style={{color:'var(--muted)',fontSize:13}}>No preview captured for {current}.</span>,
  };
  return <>
    <DocsTopBar theme={theme} onTheme={setTheme} onSearch={()=>setSearch(true)} section={section} onSection={setSection}/>
    <div style={{display:'flex',maxWidth:1280,margin:'0 auto',paddingInline:20,alignItems:'flex-start'}}>
      <DocsSidebar groups={GROUPS} current={current} onSelect={setCurrent} query={query} onQuery={setQuery}/>
      <ComponentPage name={current} description={page.description} preview={page.preview} classes={page.classes} props={page.props}/>
      <DocsToc items={['Usage','CSS Classes','API Reference']} active="Usage"/>
    </div>
    <SearchPalette isOpen={search} onClose={()=>setSearch(false)} items={ALL} onPick={setCurrent}/>
  </>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script></body></html>
