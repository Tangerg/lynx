<!-- @dsCard group="Spacing" viewport="700x170" name="Elevation" subtitle="Three shadows only — surface, overlay, field" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.g{display:flex;gap:18px}.c{flex:1;border-radius:var(--radius-2xl);background:var(--surface);padding:14px 16px}
.c b{display:block;font-size:13px;font-weight:600}.c span{font-size:11px;color:var(--muted)}</style>
</head><body><div class="g">
<div class="c" style="box-shadow:var(--surface-shadow)"><b>surface</b><span>Cards, accordions, tabs</span></div>
<div class="c" style="box-shadow:var(--overlay-shadow)"><b>overlay</b><span>Modals, popovers, menus</span></div>
<div class="c" style="box-shadow:var(--field-shadow)"><b>field</b><span>Inputs, checkboxes, OTP</span></div>
</div></body></html>
