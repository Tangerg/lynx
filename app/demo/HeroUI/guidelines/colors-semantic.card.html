<!-- @dsCard group="Colors" viewport="700x150" name="Semantic" subtitle="Success, warning, danger — solid fills" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body><div class="sw"><div class="s"><i style="background:var(--success)"></i><b>success</b><span>--success</span></div><div class="s"><i style="background:var(--success-hover)"></i><b>success-hover</b><span>--success-hover</span></div><div class="s"><i style="background:var(--warning)"></i><b>warning</b><span>--warning</span></div><div class="s"><i style="background:var(--warning-hover)"></i><b>warning-hover</b><span>--warning-hover</span></div><div class="s"><i style="background:var(--danger)"></i><b>danger</b><span>--danger</span></div><div class="s"><i style="background:var(--danger-hover)"></i><b>danger-hover</b><span>--danger-hover</span></div></div></body></html>
