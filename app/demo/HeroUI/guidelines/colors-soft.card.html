<!-- @dsCard group="Colors" viewport="700x150" name="Soft pairs" subtitle="15% tint + darkened foreground — chips, alerts, soft buttons" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.pairs{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.p{border-radius:var(--radius-xl);padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.p b{font-size:13px;font-weight:600}.p span{font-size:11px;opacity:.8;font-family:var(--font-mono)}</style>
</head><body><div class="pairs">
<div class="p" style="background:var(--accent-soft);color:var(--accent-soft-foreground)"><b>Accent</b><span>accent-soft</span></div>
<div class="p" style="background:var(--success-soft);color:var(--success-soft-foreground)"><b>Success</b><span>success-soft</span></div>
<div class="p" style="background:var(--warning-soft);color:var(--warning-soft-foreground)"><b>Warning</b><span>warning-soft</span></div>
<div class="p" style="background:var(--danger-soft);color:var(--danger-soft-foreground)"><b>Danger</b><span>danger-soft</span></div>
</div></body></html>
