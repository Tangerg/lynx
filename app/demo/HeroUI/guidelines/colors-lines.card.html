<!-- @dsCard group="Colors" viewport="700x150" name="Borders & separators" subtitle="Three levels each, mixed toward the surface foreground" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body><div class="sw"><div class="s"><i style="background:var(--border)"></i><b>border</b><span>--border</span></div><div class="s"><i style="background:var(--border-secondary)"></i><b>border-secondary</b><span>--border-secondary</span></div><div class="s"><i style="background:var(--border-tertiary)"></i><b>border-tertiary</b><span>--border-tertiary</span></div><div class="s"><i style="background:var(--separator)"></i><b>separator</b><span>--separator</span></div><div class="s"><i style="background:var(--separator-secondary)"></i><b>separator-secondary</b><span>--separator-secondary</span></div><div class="s"><i style="background:var(--separator-tertiary)"></i><b>separator-tertiary</b><span>--separator-tertiary</span></div></div></body></html>
