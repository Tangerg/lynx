<!-- @dsCard group="Colors" viewport="700x170" name="Dark theme" subtitle="Same token names, different values — add class="dark"" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}body{background:oklch(12% 0.005 285.823)}</style>
</head><body><div class="dark"><div class="sw"><div class="s"><i style="background:var(--background);box-shadow:inset 0 0 0 1px var(--border)"></i><b>background</b><span>--background</span></div><div class="s"><i style="background:var(--surface)"></i><b>surface</b><span>--surface</span></div><div class="s"><i style="background:var(--surface-secondary)"></i><b>surface-secondary</b><span>--surface-secondary</span></div><div class="s"><i style="background:var(--default)"></i><b>default</b><span>--default</span></div><div class="s"><i style="background:var(--accent)"></i><b>accent</b><span>--accent</span></div><div class="s"><i style="background:var(--danger)"></i><b>danger</b><span>--danger</span></div><div class="s"><i style="background:var(--warning)"></i><b>warning</b><span>--warning</span></div><div class="s"><i style="background:var(--segment)"></i><b>segment</b><span>--segment</span></div></div></div>
<style>.dark b{color:var(--snow)}.dark span{color:oklch(70.5% 0.015 286.067)}</style></body></html>
