<!-- @dsCard group="Colors" viewport="700x150" name="Field tokens" subtitle="Inputs, checkboxes and OTP slots theme independently of surfaces" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body><div class="sw"><div class="s"><i style="background:var(--field-background);box-shadow:inset 0 0 0 1px var(--border)"></i><b>field-background</b><span>--field-background</span></div><div class="s"><i style="background:var(--field-hover);box-shadow:inset 0 0 0 1px var(--border)"></i><b>field-hover</b><span>--field-hover</span></div><div class="s"><i style="background:var(--field-foreground)"></i><b>field-foreground</b><span>--field-foreground</span></div><div class="s"><i style="background:var(--field-placeholder)"></i><b>field-placeholder</b><span>--field-placeholder</span></div><div class="s"><i style="background:var(--field-border-hover)"></i><b>field-border-hover</b><span>--field-border-hover</span></div><div class="s"><i style="background:var(--field-border-focus)"></i><b>field-border-focus</b><span>--field-border-focus</span></div></div></body></html>
