<!-- @dsCard group="Colors" viewport="700x150" name="Core" subtitle="Background, foreground, accent — the four you set per theme" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body><div class="sw"><div class="s"><i style="background:var(--background);box-shadow:inset 0 0 0 1px var(--border)"></i><b>background</b><span>--background</span></div><div class="s"><i style="background:var(--foreground)"></i><b>foreground</b><span>--foreground</span></div><div class="s"><i style="background:var(--accent)"></i><b>accent</b><span>--accent</span></div><div class="s"><i style="background:var(--accent-foreground);box-shadow:inset 0 0 0 1px var(--border)"></i><b>accent-foreground</b><span>--accent-foreground</span></div><div class="s"><i style="background:var(--muted)"></i><b>muted</b><span>--muted</span></div><div class="s"><i style="background:var(--default);box-shadow:inset 0 0 0 1px var(--border)"></i><b>default</b><span>--default</span></div></div></body></html>
