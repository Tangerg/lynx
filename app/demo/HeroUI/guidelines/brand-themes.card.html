<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.g{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.t{border-radius:var(--radius-xl);padding:12px;display:flex;flex-direction:column;gap:8px;box-shadow:var(--surface-shadow)}
.t b{font-size:11px;font-weight:600}.t i{height:22px;border-radius:min(11px,var(--radius-3xl));display:block}</style>
</head><body><div class="g">
<div class="t" style="background:#fff;color:#1c1c1e"><b>default</b><i style="background:oklch(0.6204 0.195 253.83)"></i></div>
<div class="t" style="background:#fff;color:#1c1c1e"><b>mint</b><i style="background:oklch(0.7329 0.1935 150.81)"></i></div>
<div class="t" style="background:#fff;color:#1c1c1e"><b>lavender</b><i style="background:oklch(0.62 0.19 300)"></i></div>
<div class="t" style="background:#111;color:#fafafa"><b>black</b><i style="background:oklch(0.9911 0 0)"></i></div>
<div class="t" style="background:#111;color:#fafafa"><b>netflix</b><i style="background:oklch(0.55 0.23 27)"></i></div>
</div></body></html>
