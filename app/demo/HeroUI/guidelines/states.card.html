<!-- @dsCard group="Spacing" viewport="700x150" name="Interaction states" subtitle="Hover mixes 4–10% foreground; focus is a 2px offset accent ring" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.g{display:flex;gap:10px;align-items:center}
.b{height:40px;padding:0 16px;border:0;border-radius:24px;font:500 14px var(--font-sans);display:inline-flex;align-items:center;background:var(--accent);color:var(--accent-foreground)}
.lbl{font-size:10px;color:var(--muted);font-family:var(--font-mono);text-align:center;display:block;margin-top:6px}
.w{display:flex;flex-direction:column}</style>
</head><body><div class="g">
<div class="w"><span class="b">Rest</span><span class="lbl">--accent</span></div>
<div class="w"><span class="b" style="background:var(--accent-hover)">Hover</span><span class="lbl">--accent-hover</span></div>
<div class="w"><span class="b" style="background:var(--accent-hover);transform:scale(.97)">Pressed</span><span class="lbl">scale(.97)</span></div>
<div class="w"><span class="b" style="outline:2px solid var(--focus);outline-offset:2px">Focus</span><span class="lbl">ring 2px / 2px</span></div>
<div class="w"><span class="b" style="opacity:var(--disabled-opacity)">Disabled</span><span class="lbl">opacity .5</span></div>
</div></body></html>
