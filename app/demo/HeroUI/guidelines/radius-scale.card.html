<!-- @dsCard group="Spacing" viewport="700x150" name="Radius" subtitle="Derived from --radius (8px); components cap with min()" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.g{display:flex;gap:12px}.c{display:flex;flex-direction:column;align-items:center;gap:6px}
.c i{display:block;width:66px;height:52px;background:var(--surface);box-shadow:var(--surface-shadow)}
.c b{font-size:10px;color:var(--muted);font-family:var(--font-mono)}</style>
</head><body><div class="g"><div class="c"><i style="border-radius:var(--radius-xs)"></i><b>xs 2</b></div><div class="c"><i style="border-radius:var(--radius-sm)"></i><b>sm 4</b></div><div class="c"><i style="border-radius:var(--radius-md)"></i><b>md 6</b></div><div class="c"><i style="border-radius:var(--radius-lg)"></i><b>lg 8</b></div><div class="c"><i style="border-radius:var(--radius-xl)"></i><b>xl 12</b></div><div class="c"><i style="border-radius:var(--radius-2xl)"></i><b>2xl 16</b></div><div class="c"><i style="border-radius:var(--radius-3xl)"></i><b>3xl 24</b></div><div class="c"><i style="border-radius:var(--radius-4xl)"></i><b>4xl 32</b></div></div></body></html>
