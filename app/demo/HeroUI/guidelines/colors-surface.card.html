<!-- @dsCard group="Colors" viewport="700x150" name="Surfaces" subtitle="Non-overlay containers, calculated from --surface" -->
<!doctype html><html class="light"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:18px;background:var(--background);font-family:var(--font-sans);color:var(--foreground)}.sw{display:grid;grid-auto-flow:column;gap:10px;align-items:stretch}
.s{display:flex;flex-direction:column;gap:6px;min-width:0}
.s i{display:block;height:56px;border-radius:var(--radius-xl)}
.s b{font-size:11px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.s span{font-size:10px;color:var(--muted);font-family:var(--font-mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}</style>
</head><body><div class="sw"><div class="s"><i style="background:var(--surface);box-shadow:inset 0 0 0 1px var(--border)"></i><b>surface</b><span>--surface</span></div><div class="s"><i style="background:var(--surface-hover);box-shadow:inset 0 0 0 1px var(--border)"></i><b>surface-hover</b><span>--surface-hover</span></div><div class="s"><i style="background:var(--surface-secondary)"></i><b>surface-secondary</b><span>--surface-secondary</span></div><div class="s"><i style="background:var(--surface-tertiary)"></i><b>surface-tertiary</b><span>--surface-tertiary</span></div><div class="s"><i style="background:var(--background-secondary)"></i><b>background-secondary</b><span>--background-secondary</span></div><div class="s"><i style="background:var(--background-tertiary)"></i><b>background-tertiary</b><span>--background-tertiary</span></div></div></body></html>
